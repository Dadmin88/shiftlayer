name: Cleanup scratch branches

on:
  push:
    branches: [main]
    paths:
      - '.cleanup-trigger'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Delete scratch branch refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for branch in gif-quality-fix media-quality-fix sharp-gif-final branch-cleanup; do
            code=$(curl -sS -o /tmp/resp -w '%{http_code}' \
              -X DELETE \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}")
            if [ "$code" != "204" ] && [ "$code" != "422" ] && [ "$code" != "404" ]; then
              cat /tmp/resp
              echo "Failed deleting ${branch}: HTTP ${code}"
              exit 1
            fi
          done

      - name: Remove one-shot cleanup files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .cleanup-trigger .github/workflows/cleanup-scratch-branches.yml
          git commit -m "chore: remove one-shot branch cleanup"
          git push
