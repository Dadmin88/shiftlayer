name: Rebuild demo GIF

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate sharp looping README GIF
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -y -i assets/shiftlayer-demo.mp4 \
            -vf "fps=12,scale=960:-1:flags=lanczos,palettegen=max_colors=256:stats_mode=full" \
            /tmp/shiftlayer-palette.png
          ffmpeg -y -i assets/shiftlayer-demo.mp4 -i /tmp/shiftlayer-palette.png \
            -lavfi "fps=12,scale=960:-1:flags=lanczos[x];[x][1:v]paletteuse=dither=sierra2_4a" \
            -loop 0 assets/shiftlayer-demo.gif

      - name: Commit improved GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shiftlayer-demo.gif
          git diff --cached --quiet && exit 0
          git commit -m "docs: sharpen README demo GIF"
          git push
